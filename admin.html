<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nova Mining - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="admin-body">

<div class="sidebar">
  <h2>Nova Admin</h2>
  <button onclick="showSection('stats')">Dashboard</button>
  <button onclick="showSection('users')">Usuarios</button>
  <button onclick="showSection('withdrawals')">Retiros</button>
  <button onclick="showSection('codes')">Códigos</button>
  <button onclick="location.href='dashboard.html'">Salir</button>
</div>

<div class="main">
  <div id="stats" class="section"></div>
  <div id="users" class="section" style="display:none;"></div>
  <div id="withdrawals" class="section" style="display:none;"></div>
  <div id="codes" class="section" style="display:none;"></div>
</div>

<script type="module" src="js/dashboard.js"></script>

</body>
</html>
