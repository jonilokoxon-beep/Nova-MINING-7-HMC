<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <span>Nova <b>MINING 7</b> HMC</span>
  <span class="user">Admin</span>
</header>

<div class="stats">
  <div class="box blue">Saldo<br><b>$0.00</b></div>
  <div class="box green">Ganancias<br><b>$0.00</b></div>
  <div class="box gold">Retirado<br><b>$0.00</b></div>
</div>

<h3>Planes de Inversión</h3>

<div class="plans">
  <div class="plan basic">
    <h4>Básico</h4>
    <p>$100</p>
    <p>$5 diario</p>
    <button>Comprar</button>
  </div>

  <div class="plan vip">
    <h4>VIP 1</h4>
    <p>$500</p>
    <p>$50 diario</p>
    <button>Comprar</button>
  </div>

  <div class="plan vip2">
    <h4>VIP 2</h4>
    <p>$1500</p>
    <p>$150 diario</p>
    <button>Comprar</button>
  </div>
</div>

<nav class="bottom">
  <span>Inicio</span>
  <span>Órdenes</span>
  <span>Retiros</span>
  <span>Cuenta</span>
</nav>

<script src="js/app.js"></script>
</body>
</html>
