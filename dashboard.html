<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nova Mining - Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div style="padding:20px;">

    <h2>Panel Principal</h2>

    <div class="card">
      <p>ID Usuario: <b id="p-id">----</b></p>
      <p>VIP: <b id="p-vip">0</b></p>
      <p>Balance:</p>
      <h1>$<span id="p-balance">0.00</span></h1>
    </div>

    <div style="margin-top:20px;">
      <button onclick="location.href='admin.html'" id="adminBtn" style="display:none;">
        Panel Admin
      </button>

      <button onclick="logout()" style="margin-top:10px;">
        Cerrar sesión
      </button>
    </div>

  </div>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "index.html";
      }

      if (user.email === "joni.lokoxon@gmail.com") {
        document.getElementById("adminBtn").style.display = "block";
      }

      document.getElementById("p-id").innerText = user.uid;
    });

    window.logout = async function() {
      await signOut(auth);
      window.location.href = "index.html";
    };
  </script>

  <script type="module" src="js/dashboard.js"></script>

</body>
</html>
