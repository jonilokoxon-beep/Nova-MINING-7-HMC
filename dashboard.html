<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nova MINING 7 HMC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="top">
  <span>Nova <b>MINING 7</b> HMC</span>
  <button onclick="logout()">Salir</button>
</header>

<div class="stats">
  <div class="box blue">Saldo<br><b>$0.00</b></div>
  <div class="box green">Ganancias<br><b>$0.00</b></div>
  <div class="box gold">Retirado<br><b>$0.00</b></div>
</div>

<div id="app">
  <div id="content">

    <section id="inicio" class="page" style="display:block">
      <div class="banner">
        <img src="assets/banner.gif">
      </div>

      <div class="quick-actions">
        <button onclick="go('productos')">VIP</button>
        <button>Registro diario</button>
        <button>Depósito</button>
        <button>Retiro</button>
        <button>
          Tamaño del equipo<br>
          <b id="teamCount">0</b>
        </button>
      </div>
    </section>

    <section id="productos" class="page">
      <h3 style="padding:15px">Productos VIP</h3>
      <div id="productsList"></div>
    </section>

    <section id="orders" class="page">
      <h3 style="padding:15px">Mis Órdenes</h3>

      <div class="total-box">
        <span>Total a ganar</span>
        <b id="totalProfit">$0.00</b>
      </div>

      <div class="orders" id="ordersList"></div>
    </section>

    <section id="profile" class="page">
      <h3 style="padding:15px">Mi Perfil</h3>
    </section>

  </div>
</div>

<nav class="bottom">
  <button onclick="go('inicio')">🏠<span>Inicio</span></button>
  <button onclick="go('productos')">🛒<span>Productos</span></button>
  <button onclick="go('orders')">📦<span>Órdenes</span></button>
  <button onclick="go('profile')">👤<span>Perfil</span></button>
</nav>

<script type="module" src="js/dashboard.js"></script>
<script type="module" src="profile.js"></script>
<section id="profile" class="page">

  <div class="profile-header">
    <h2>NOVA MINING</h2>
  </div>

  <div class="profile-card">
    <div class="user-info">
      <span>ID: <b id="p-id">----</b></span>
      <span class="vip">VIP <b id="p-vip">0</b></span>
    </div>

    <div class="balance-box">
      <div>
        <small>MXN</small>
        <h3>$<span id="p-balance">0.00</span></h3>
      </div>

      <div class="actions">
        <button id="btn-deposit">Depósito</button>
        <button id="btn-withdraw">Retiro</button>
      </div>
    </div>
  </div>

  <div class="rescue">
    <h4>🎁 Rescue Presents</h4>
    <button id="btn-rescue">Ingresar código</button>
  </div>

  <div class="profile-menu">
    <button>📄 Registro de ingresos</button>
    <button>👥 Detalles de comisión</button>
    <button id="btn-invite">📢 Invitar</button>
  </div>

</section>

</body>
</html>
