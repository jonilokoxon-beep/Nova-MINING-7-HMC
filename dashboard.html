<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nova MINING 7 HMC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="top">
  <span>Nova <b>MINING 7</b> HMC</span>
  <button id="adminBtn" onclick="go('admin-panel')" style="display:none;">ADMIN</button>
  <button onclick="logout()">Salir</button>
</header>

<!-- 📊 ESTADÍSTICAS -->
<div class="stats">
  <div class="box blue">
    Saldo<br>
    <b><span id="stat-balance">0.00</span></b>
  </div>

  <div class="box green">
    Ganancias<br>
    <b><span id="stat-profit">0.00</span></b>
  </div>

  <div class="box gold">
    Retirado<br>
    <b><span id="stat-withdrawn">0.00</span></b>
  </div>
</div>

<div id="app">
<div id="content">

<!-- 🏠 INICIO -->
<section id="inicio" class="page" style="display:block">

  <div class="quick-actions">

    <div class="card">
      <h3>💎 Nivel VIP</h3>
      <p id="vip-level">VIP 0</p>
    </div>

    <div class="card">
      <h3>🎁 Registro Diario</h3>
      <p id="daily-gift">Disponible</p>
      <button onclick="reclamarRegalo()">Reclamar</button>
    </div>

    <div class="card">
      <h3>👥 Tamaño del equipo</h3>
      <p id="team-size">0</p>
      <p>Bono equipo: <b id="team-bonus">$0.00</b></p>
    </div>

  </div>

</section>


<!-- 🛒 PRODUCTOS -->
<section id="productos" class="page">
  <h3 style="padding:15px">Productos</h3>
  <div id="productsList"></div>
</section>


<!-- 📦 ÓRDENES -->
<section id="orders" class="page">
  <h3 style="padding:15px">Mis Órdenes</h3>
  <div id="ordersList"></div>
</section>


<!-- 👤 PERFIL -->
<section id="profile" class="page">

  <div class="profile-card">

    <p>ID: <b id="p-id">----</b></p>
    <p>Saldo: $<b id="p-balance">0.00</b></p>

    <div style="margin-top:15px;">
      <button onclick="hacerDeposito()">Depositar</button>
    </div>

    <div style="margin-top:15px;">
      <input type="number" id="withdrawAmount" placeholder="Monto a retirar" />
      <button onclick="solicitarRetiro()">Solicitar Retiro</button>
    </div>

  </div>

</section>


<!-- 👑 PANEL ADMIN -->
<section id="admin-panel" class="page" style="display:none;">

  <h2 style="padding:15px;">Panel Admin</h2>

  <h3 style="padding:10px;">Retiros Pendientes</h3>
  <div id="admin-withdrawals"></div>

  <h3 style="padding:10px;">Depósitos Pendientes</h3>
  <div id="admin-deposits"></div>

</section>


</div>
</div>

<!-- 🔻 MENÚ INFERIOR -->
<nav class="bottom">
  <button onclick="go('inicio')">🏠<span>Inicio</span></button>
  <button onclick="go('productos')">🛒<span>Productos</span></button>
  <button onclick="go('orders')">📦<span>Órdenes</span></button>
  <button onclick="go('profile')">👤<span>Perfil</span></button>
</nav>

<script type="module" src="js/dashboard.js"></script>

</body>
</html>
