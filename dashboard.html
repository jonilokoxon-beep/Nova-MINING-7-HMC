<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nova MINING 7 HMC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- 💰 MODAL DEPÓSITO -->
<div id="depositModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3>Solicitar Depósito</h3>
    <input type="number" id="depositAmount" placeholder="Monto" />
    <button id="confirmDeposit">Enviar</button>
    <button onclick="closeDeposit()">Cancelar</button>
  </div>
</div>

<header class="top">
  <span>Nova <b>MINING 7</b> HMC</span>
  <button onclick="logout()">Salir</button>
</header>

<div class="stats">
  <div class="box blue">
    Saldo<br>
    <b>$<span id="stat-balance">0.00</span></b>
  </div>

  <div class="box green">
    Ganancias<br>
    <b>$<span id="stat-profit">0.00</span></b>
  </div>

  <div class="box gold">
    Retirado<br>
    <b>$<span id="stat-withdrawn">0.00</span></b>
  </div>
</div>

<div id="content">

<!-- 🏠 INICIO -->
<section id="inicio" class="page" style="display:block;">
  <div class="quick-actions">
    <button onclick="go('productos')">💎 Productos</button>
    <button onclick="go('orders')">📦 Órdenes</button>
    <button onclick="go('profile')">👤 Perfil</button>
    <button id="quick-deposit">💰 Depósito</button>
    <button id="quick-withdraw">💸 Retiro</button>
  </div>
</section>

<!-- 🛒 PRODUCTOS -->
<section id="productos" class="page" style="display:none;">
  <h3>Productos VIP</h3>
  <div id="productsList"></div>
</section>

<!-- 📦 ÓRDENES -->
<section id="orders" class="page" style="display:none;">
  <h3>Mis Órdenes</h3>
  <div id="ordersList"></div>
</section>

<!-- 👤 PERFIL -->
<section id="profile" class="page" style="display:none;">
  <h3>Mi Perfil</h3>
  <p>ID: <b id="p-id">----</b></p>
  <p>Saldo: $<span id="p-balance">0.00</span></p>
  <button id="btn-deposit">Depósito</button>
  <button id="btn-withdraw">Retiro</button>
</section>

</div>

<nav class="bottom">
  <button onclick="go('inicio')">Inicio</button>
  <button onclick="go('productos')">Productos</button>
  <button onclick="go('orders')">Órdenes</button>
  <button onclick="go('profile')">Perfil</button>
</nav>

<script type="module" src="js/dashboard.js"></script>

</body>
</html>
