<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nova MINING 7 HMC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="top">
  <span>Nova <b>MINING 7</b> HMC</span>
  <button onclick="logout()">Salir</button>
</header>

<div class="stats">
  <div class="box blue">
    Saldo<br>
    <b>$<span id="stat-balance">0.00</span></b>
  </div>

  <div class="box green">
    Ganancias<br>
    <b>$<span id="stat-profit">0.00</span></b>
  </div>

  <div class="box gold">
    Retirado<br>
    <b>$<span id="stat-withdrawn">0.00</span></b>
  </div>
</div>

<section id="inicio" class="page">
</section>

<section id="productos" class="page">
  <h3 style="padding:15px">Productos VIP</h3>
  <div id="productsList"></div>
</section>

<section id="orders" class="page">
  <h3 style="padding:15px">Mis Órdenes</h3>
  <div id="ordersList"></div>
</section>

<section id="profile" class="page">
  <div class="card">
    ID: <b id="p-id"></b><br>
    VIP: <b id="p-vip">0</b><br><br>
    Balance: $<span id="p-balance">0.00</span>
  </div>

  <input type="number" id="withdrawAmount" placeholder="Monto a retirar" />
  <button id="withdrawBtn">Solicitar Retiro</button>

  <div id="transactionHistory"></div>
</section>

<nav class="bottom">
  <button onclick="go('inicio')">🏠</button>
  <button onclick="go('productos')">🛒</button>
  <button onclick="go('orders')">📦</button>
  <button onclick="go('profile')">👤</button>
</nav>

<!-- 🔥 BOTÓN FLOTANTE ADMIN -->
<button id="adminFab">⚙</button>

<script type="module" src="js/dashboard.js"></script>

</body>
</html>
