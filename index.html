<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginView">
  <h2>Iniciar Sesión</h2>
  <input id="email" type="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">
  <button id="loginBtn">Entrar</button>
  <p onclick="showRegister()">Crear cuenta</p>
</div>

<!-- ================= REGISTER ================= -->
<div id="registerView" style="display:none;">
  <h2>Registro</h2>
  <input id="regEmail" type="email" placeholder="Correo">
  <input id="regPassword" type="password" placeholder="Contraseña">
  <button id="registerBtn">Registrarse</button>
  <p onclick="showLogin()">Volver</p>
</div>

<!-- ================= APP ================= -->
<div id="appView" style="display:none;">

  <!-- NAV -->
  <div class="bottom-nav">
    <button onclick="go('inicio')">Inicio</button>
    <button onclick="go('productos')">Productos</button>
    <button onclick="go('ordenes')">Órdenes</button>
    <button onclick="go('perfil')">Perfil</button>
  </div>

  <!-- ================= INICIO ================= -->
  <div id="inicio" class="page" style="display:block;">
    <h2>Inicio</h2>

    <div class="card">
      Balance disponible:
      <h3>$<span id="stat-balance">0.00</span></h3>
    </div>

    <div class="card">
      Ganancia total:
      <h3>$<span id="stat-profit">0.00</span></h3>
    </div>

    <div class="card">
      Retirado:
      <h3>$<span id="stat-withdrawn">0.00</span></h3>
    </div>
  </div>

  <!-- ================= PRODUCTOS ================= -->
  <div id="productos" class="page" style="display:none;">
    <h2>Productos</h2>
    <div id="productsList"></div>
  </div>

  <!-- ================= ORDENES ================= -->
  <div id="ordenes" class="page" style="display:none;">
    <h2>Mis Órdenes</h2>
    <div id="ordersList"></div>
  </div>

  <!-- ================= PERFIL ================= -->
  <div id="perfil" class="page" style="display:none;">
    <h2>Perfil</h2>

    <div class="card">
      ID: <span id="p-id"></span><br>
      Balance: $<span id="p-balance"></span><br>
      VIP: <span id="p-vip"></span>
    </div>

    <div class="card">
      <h3>Solicitar Retiro</h3>
      <input id="montoRetiro" type="number" placeholder="Monto">
      <button onclick="solicitarRetiro()">Solicitar Retiro</button>
    </div>

    <div class="card">
      <h3>Ingresar Código</h3>
      <button onclick="ingresarCodigo()">Ingresar código</button>
    </div>

    <div class="card">
      <h3>Historial</h3>
      <div id="transactionHistory"></div>
    </div>

    <button id="logoutBtn">Cerrar sesión</button>
  </div>

  <!-- ================= ADMIN ================= -->
  <div id="adminPage" class="page" style="display:none;">
    <h2>Panel Admin</h2>

    <h3>Estadísticas</h3>
    <div id="pendingDeposits"></div>

    <h3>Retiros Pendientes</h3>
    <div id="pendingWithdrawals"></div>

    <h3>Usuarios</h3>
    <div id="adminUsers"></div>
  </div>

  <!-- BOTÓN FLOTANTE ADMIN -->
  <button id="adminFab"
    onclick="go('adminPage')"
    style="
      position:fixed;
      bottom:80px;
      right:20px;
      width:55px;
      height:55px;
      border-radius:50%;
      display:none;
      align-items:center;
      justify-content:center;
      background:#ff9800;
      color:#fff;
      font-size:20px;
      border:none;">
    ⚙
  </button>

</div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
