<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nova MINING 7 HMC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ================= LOGIN ================= -->
<section id="loginView" class="view login-bg">
  <div class="login-card">
    <h2>Nova MINING 7 HMC</h2>

    <input type="email" id="loginEmail" placeholder="Correo">
    <input type="password" id="loginPassword" placeholder="Contraseña">

    <button id="loginBtn">Ingresar</button>

    <p>¿No tienes cuenta?
      <a href="#" id="goRegister">Crear cuenta</a>
    </p>
  </div>
</section>

<!-- ================= REGISTER ================= -->
<section id="registerView" class="view login-bg" style="display:none;">
  <div class="login-card">
    <h2>Crear Cuenta</h2>

    <input type="email" id="registerEmail" placeholder="Correo">
    <input type="password" id="registerPassword" placeholder="Contraseña">

    <button id="registerBtn">Registrarme</button>

    <p><a href="#" id="goLogin">Volver</a></p>
  </div>
</section>

<!-- ================= APP ================= -->
<section id="appView" class="view" style="display:none;">

<header class="top">
  <span>Nova <b>MINING 7</b> HMC</span>
  <button id="logoutBtn">Salir</button>
</header>

<div class="stats">
  <div class="box blue">
    Saldo<br>
    <b>$<span id="stat-balance">0.00</span></b>
  </div>
  <div class="box gold">
    Retirado<br>
    <b>$<span id="stat-withdrawn">0.00</span></b>
  </div>
</div>

<!-- ===== PÁGINAS INTERNAS ===== -->

<div id="inicio" class="page">Bienvenido</div>

<div id="productos" class="page" style="display:none;">
  <div id="productsList"></div>
</div>

<div id="orders" class="page" style="display:none;">
  <div id="ordersList"></div>
</div>

<div id="profile" class="page" style="display:none;">
  ID: <span id="p-id"></span>
</div>

<nav class="bottom">
  <button onclick="go('inicio')">🏠</button>
  <button onclick="go('productos')">🛒</button>
  <button onclick="go('orders')">📦</button>
  <button onclick="go('profile')">👤</button>
</nav>

<button id="adminFab" style="display:none;">⚙</button>

</section>

<!-- ================= ADMIN ================= -->
<section id="adminView" class="view" style="display:none;">
  <h2>Panel Admin</h2>
  <button onclick="goApp()">Volver</button>
</section>
<script type="module" src="js/dashboard.js"></script>

</body>
</html>
